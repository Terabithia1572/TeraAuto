name: TeraAuto CI/CD Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify TeraAuto APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK Build-Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platform-tools"
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/34.0.0"
          echo "$BUILD_TOOLS_PATH" >> $GITHUB_PATH
          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS_PATH" >> $GITHUB_ENV

      - name: Install Apktool v3.0.3
        run: |
          sudo curl -sSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sSL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_3.0.3.jar -o /usr/local/bin/apktool.jar || \
          sudo curl -sSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Build, Zipalign & Sign TeraAuto APK
        run: |
          chmod +x scripts/build_teraauto.sh
          ./scripts/build_teraauto.sh src-decompiled release keystore/teraauto.jks teraauto123 teraauto

      - name: Generate Checksums & Metadata
        run: |
          cd release
          sha256sum TeraAuto-v2.0.2-arm64-signed.apk > TeraAuto-v2.0.2-arm64-signed.apk.sha256
          md5sum TeraAuto-v2.0.2-arm64-signed.apk > TeraAuto-v2.0.2-arm64-signed.apk.md5
          ls -la
          cat TeraAuto-v2.0.2-arm64-signed.apk.sha256

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeraAuto-v2.0.2-arm64-signed
          path: |
            release/TeraAuto-v2.0.2-arm64-signed.apk
            release/TeraAuto-v2.0.2-arm64-signed.apk.sha256
            release/TeraAuto-v2.0.2-arm64-signed.apk.md5
          retention-days: 30
